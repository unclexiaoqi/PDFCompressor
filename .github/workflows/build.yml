name: build

# 手动触发，或 push 一个 v* 标签
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows (Portable + Setup)
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 读取版本号
        shell: pwsh
        run: |
          $version = (Select-String -Path engine\__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "版本 $version"

      - name: 打包 exe
        run: python -m PyInstaller PDFCompressor.spec --noconfirm

      - name: 生成绿色版 zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\PDFCompressor\* -DestinationPath "dist\PDFCompressor-$env:VERSION-Portable.zip"

      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress

      - name: 编译安装包
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC：$iscc" }
          & $iscc "/DAppVersion=$env:VERSION" installer\PDFCompressor.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 失败" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            installer/output/*.exe
          if-no-files-found: error

  # ----------------------------------------------------------------- macOS
  # 只在手动触发时跑（workflow_dispatch）：macOS 构建耗时且依赖 runner 环境，
  # 打 tag 时只自动构建 Windows。Intel 机器可以在本地跑 build-macos.sh。
  macos:
    name: macOS (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建 .app / zip / dmg
        run: bash build-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
